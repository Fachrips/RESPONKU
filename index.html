      host.innerHTML = `${evalHTML}<p class="lead" style="margin-bottom:12px">Urutkan tujuh langkah setup chatbot dengan benar. Seret kartu ke nomor urutan, atau ketuk kartu lalu ketuk nomornya.</p>
        ${sub ? '' : `<div class="numbar" role="group" aria-label="Pilih nomor urutan"><span class="small">Ketuk nomor:</span>${[1, 2, 3, 4, 5, 6, 7].map(n => `<button class="nb ${at(n) ? 'on' : ''}" data-target="s${n}" aria-label="Urutan ${n}${at(n) ? ', sudah terisi' : ''}">${n}</button>`).join('')}</div>`}
        <div class="s-grid" style="align-items:start">
          <div class="bank" data-target="bank"><h3>${ic('layers')} Langkah <span class="muted small">(${rest.length} tersisa)</span></h3><div class="items">${rest.map(id => card(id, false)).join('') || `<p class="empty">${sub ? 'Semua kartu sudah ditempatkan.' : 'Semua kartu sudah ditempatkan. Tekan Periksa.'}</p>`}</div></div>
          <ol class="slots">${[1, 2, 3, 4, 5, 6, 7].map(n => { const id = at(n);
            return `<li class="slotrow"><span class="num">${n}</span><div class="slotz ${id ? 'f' : ''}" data-target="s${n}">${id ? card(id, sub) : '<span class="empty">Letakkan langkah di sini</span>'}</div></li>`; }).join('')}</ol>
        </div>
        <div class="actions"><span class="hint">${ic('info')} ${sub ? 'Jawaban Anda tersimpan di perangkat ini.' : rest.length ? `${rest.length} kartu belum ditempatkan.` : 'Siap diperiksa.'}</span>
          <div class="btns"><button class="btn btn-secondary" id="bReset" ${!sub && rest.length === 7 ? 'disabled' : ''}>${ic('rotate-ccw')} Ulangi</button>
          ${sub ? '' : `<button class="btn btn-primary" id="bCheck" ${rest.length ? 'disabled' : ''}>Periksa</button>`}</div></div>`;
      $('#bNext', root).disabled = !sub;
    }
    const dnd = bindDnD(host, { isLocked: () => !!A.submitted, onMove: (id, t) => {
      const from = P[id];
      if (t === 'bank') delete P[id];
      else { const occ = ids.find(x => x !== id && P[x] === t); if (occ) { if (from) P[occ] = from; else delete P[occ]; } P[id] = t; }
      save(); SFX.pop(); draw(); } });
    host.addEventListener('click', e => {
      if (e.target.closest('#bCheck')) { A.score = ids.filter((id, i) => P[id] === 's' + (i + 1)).length; A.submitted = true; commit(); A.score >= 5 ? SFX.ok() : SFX.no(); draw(); host.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); }
      if (e.target.closest('#bReset')) { Object.keys(P).forEach(k => delete P[k]); A.submitted = false; delete A.score; commit(); dnd.clear(); draw(); }
    });
    draw();
    wireCardNav(root, { back: 's15', onNext: () => {
      S.seen.s16 = true; S.done.C = true; commit(); go('s05'); } });
  }
};

/* ================= S17 · Struktur respons (3 slide, perlakuan seperti S06) ================= */
const CHAT17 = [
  { from: 'sys', text: 'Pertanyaan yang sama, dua balasan berbeda' },
  { from: 'cust', text: 'Buka sampai jam berapa, Kak?', time: '20.10' },
  { from: 'bot', tag: 'Balasan 1', text: 'Buka.', time: '20.10' },
  { from: 'cust', text: 'Buka sampai jam berapa, Kak?', time: '20.12' },
  { from: 'bot', tag: 'Balasan 2', text: 'Halo, Kak! Kami buka Senin–Sabtu pukul 08.00–17.00. Ada yang ingin dipesan hari ini?', time: '20.12' }
];
const SEGS17 = ['Halo, Kak!', 'Kami buka Senin–Sabtu pukul 08.00–17.00.', 'Hari Minggu kami libur.', 'Ada yang ingin dipesan hari ini?', 'Terima kasih, Kak!'];
const PARTS17 = [
  { icon: 'hand', tone: '', title: 'Sapaan ramah', text: 'Buka dengan sapaan yang hangat, supaya pelanggan merasa disambut sejak kalimat pertama.', ex: [{ from: 'bot', tag: 'Chatbot AI', text: SEGS17[0] }] },
  { icon: 'target', tone: 't-krem', title: 'Jawaban inti', text: 'Langsung jawab hal yang ditanyakan, sesuai informasi usaha. Jangan memutar-mutar.', ex: [{ from: 'cust', text: 'Buka sampai jam berapa, Kak?' }, { from: 'bot', tag: 'Chatbot AI', text: SEGS17[1] }] },
  { icon: 'info', tone: 't-mint', title: 'Informasi pendukung', text: 'Tambahkan keterangan singkat bila perlu, misalnya hal yang berkaitan dengan jawaban tadi. Cukup satu kalimat.', ex: [{ from: 'bot', tag: 'Chatbot AI', text: SEGS17[2] }] },
  { icon: 'arrow-right', tone: '', title: 'Ajakan tindak lanjut', text: 'Tunjukkan langkah berikutnya, supaya percakapan tidak berhenti di jawaban.', ex: [{ from: 'bot', tag: 'Chatbot AI', text: SEGS17[3] }] },
  { icon: 'heart', tone: 't-krem', title: 'Penutup sopan', text: 'Tutup dengan ucapan ramah dan singkat.', ex: [{ from: 'bot', tag: 'Chatbot AI', text: SEGS17[4] }] }
];
const CONTOH17 = [
  { icon: 'thumbs-up', tone: 't-mint', title: 'Respons baik', text: 'Menyapa, menjawab langsung, sesuai informasi usaha, dan mengajak ke langkah berikutnya.',
    ex: [{ from: 'cust', text: 'Buka sampai jam berapa, Kak?' }, { from: 'bot', tag: 'Chatbot AI', text: 'Halo, Kak! Kami buka Senin–Sabtu pukul 08.00–17.00. Ada yang ingin dipesan hari ini?' }] },
  { icon: 'triangle-alert', tone: 't-krem', title: 'Respons kurang', text: 'Dua kesalahan yang sering muncul: terlalu singkat, dan menjanjikan hal yang tidak ada dalam informasi usaha.',
    ex: [{ from: 'bot', tag: 'Kurang: tanpa sapaan, jam, dan ajakan', text: 'Buka.' }, { from: 'bot', tag: 'Kurang: menjanjikan hal yang tidak ada', text: 'Kami buka 24 jam, gratis ongkir!' }] },
  { icon: 'headset', tone: '', title: 'Respons pengalihan', text: 'Untuk keluhan atau hal di luar informasi usaha, alihkan dengan bahasa sederhana dan kalimat pendek. Jangan menjanjikan apa pun.',
    ex: [{ from: 'cust', text: 'Pesanan saya rusak, minta ganti rugi!' }, { from: 'bot', tag: 'Chatbot AI', text: 'Terima kasih sudah menghubungi kami. Untuk hal ini, tim kami akan membantu langsung pada jam layanan 08.00–17.00.' }] }
];
SC.s17 = {
  render() {
    return `<div class="stage">
      <div class="scene-head"><div><span class="eyebrow">${ic('message-circle')} Kartu D · Respons Chatbot</span><h1 class="title">Struktur respons awal</h1></div>
        <div class="dots-wrap" id="slideMeta" aria-live="polite"></div></div>
      <div class="panel slidebox" id="slides"></div>
      ${cardNavHTML()}</div>`;
  },
  init(root) {
    let slide = 0, chat = null, chatDone = !!S.opened.s17chat, hiSeg = null;
    const box = $('#slides', root), bNext = $('#bNext', root);
    const tiles = (arr, prefix, cls) => arr.map((f, i) => `<button class="tile ${cls[i % cls.length]} ${S.opened[prefix + i] ? 'seen' : ''}" data-i="${i}">
        <span class="ti">${ic(f.icon)}</span><span class="tx"><b>${f.title}</b><small>${S.opened[prefix + i] ? ic('circle-check') + ' Sudah dibuka' : 'Ketuk untuk membaca'}</small></span><span class="ch">${ic('chevron-right')}</span></button>`).join('');
    const seen = (p, n) => Array.from({ length: n }, (_, i) => i).filter(i => S.opened[p + i]).length;
    function meta() {
      $('#slideMeta', root).innerHTML = `<span class="dots" aria-hidden="true">${[0, 1, 2].map(i => `<i class="${i === slide ? 'on' : ''}"></i>`).join('')}</span><span>Slide ${slide + 1} dari 3</span>`;
      bNext.disabled = slide === 0 && !chatDone;
      bNext.title = bNext.disabled ? 'Tunggu percakapan selesai, atau pilih Lewati ke slide 2' : '';
    }
    const stopChat = () => { if (chat) { chat.stop(); chat = null; } };
    const slides = [s1, s2, s3], wires = [wire1, wire2, wire3];
    function show(n, dir) {
      stopChat(); slide = n;
      box.innerHTML = `<div class="slide ${dir || ''}" role="group" aria-roledescription="slide" aria-label="Slide ${n + 1} dari 3">${slides[n]()}</div>`;
      meta(); wires[n](); if (dir) SFX.swish();
    }
    function s1() {
      return `<div class="s-grid chatfirst">
        <div><span class="eyebrow">${ic('message-circle')} Pemantik</span>
          <h2 class="sub">Balasan mana yang lebih membantu pelanggan?</h2>
          <p class="lead" style="margin-top:10px">Simak dua balasan untuk pertanyaan yang sama. Perhatikan apa yang ada, dan apa yang kurang.</p>
          <div class="status" id="st" role="status" aria-live="polite"></div>
          <div class="ctrls"><button class="btn btn-secondary" id="bReplay">${ic('rotate-ccw')} Putar ulang</button>
            <button class="btn btn-ghost" id="bSkip">Lewati ke slide 2 ${ic('skip-forward')}</button></div></div>
        <div><div class="phone"><div class="phone-top"><div class="av" aria-hidden="true">BS</div><div><strong>Kue Kering Bunda Sari</strong><small>WhatsApp</small></div></div>
          <div class="chat-body tall" id="chat17" role="log" aria-label="Dua balasan chatbot untuk pertanyaan yang sama"></div></div></div></div>`;
    }
    function wire1() {
      const st = $('#st', root), cb = $('#chat17', root);
      const done = () => { chatDone = true; S.opened.s17chat = true; save(); st.innerHTML = `${ic('circle-check')} Selesai. Balasan 2 lebih membantu. Apa saja bedanya?`; meta(); };
      chat = playChat(cb, CHAT17, { onDone: done });
      if (chatDone) { chat.showAll(); st.innerHTML = `${ic('circle-check')} Percakapan selesai.`; } else { st.innerHTML = `${ic('message-circle')} Percakapan berlangsung…`; chat.start(); }
      $('#bReplay', root).onclick = () => { st.innerHTML = `${ic('message-circle')} Percakapan berlangsung…`; chatDone = false; meta(); chat.start(); };
      $('#bSkip', root).onclick = () => { S.opened.s17chat = true; chatDone = true; save(); show(1, 'fwd'); };
    }
    function s2() {
      const lit = i => hiSeg === i ? 'on' : (S.opened['resp-' + i] ? 'seen' : '');
      return `<div class="s-grid">
        <div class="def"><span class="eyebrow">${ic('message-circle')} Contoh respons</span>
          <p class="small muted" style="margin-bottom:10px">Pelanggan bertanya: “Buka sampai jam berapa, Kak?”</p>
          <div class="msg bot big17"><span class="tag">${ic('sparkles')} Chatbot AI</span>
            <p>${SEGS17.map((s, i) => `<span class="seg5 s${i} ${lit(i)}" id="seg${i}"><sup>${i + 1}</sup>${s}</span>`).join(' ')}</p></div>
          <p class="small muted" style="margin-top:12px">Respons yang baik tersusun dari lima bagian. Ketuk tiap bagian di sebelah untuk melihat tempatnya pada contoh.</p></div>
        <div class="tiles"><h3>Lima bagian respons awal</h3>${tiles(PARTS17, 'resp-', ['', 't2', 't3'])}
          <div class="status" id="st2">${ic('mouse-pointer-click')} Ketuk tiap kartu untuk membacanya (${seen('resp-', 5)} dari 5 dibuka)</div></div></div>`;
    }
    function s3() {
      return `<div class="s-grid">
        <div class="def"><span class="eyebrow">${ic('sparkles')} Pegangan</span>
          <p class="q">Gunakan <mark>bahasa sederhana</mark>, kalimat pendek, dan <mark>jangan menjanjikan</mark> hal yang tidak ada dalam informasi usaha.</p>
          <div class="note warn" style="margin-top:16px">${ic('info')}<span>Acuan: Putra dkk. (2025); Sapiri (2026).</span></div></div>
        <div class="tiles"><h3>Baik, kurang, dan pengalihan</h3>${tiles(CONTOH17, 'contoh-', ['t2', 't3', ''])}
          <div class="status" id="st3">${ic('mouse-pointer-click')} Ketuk tiap kartu untuk melihat contohnya (${seen('contoh-', 3)} dari 3 dibuka)</div></div></div>`;
    }
    let lastIdx = null;
    function refresh() {
      if (slide === 0) return;
      box.innerHTML = `<div class="slide" role="group" aria-roledescription="slide" aria-label="Slide ${slide + 1} dari 3">${slides[slide]()}</div>`; wires[slide]();
      if (lastIdx != null) { const t = $(`.tile[data-i="${lastIdx}"]`, root); t && t.focus(); }
    }
    const wireTiles = (arr, prefix, label, onDraw) => $$('.tile', root).forEach(t => { t.onclick = () => { lastIdx = t.dataset.i; openDetail({ items: arr, index: +t.dataset.i, keyPrefix: prefix, label, onDraw, onClose: refresh }); }; });
    function wire2() { wireTiles(PARTS17, 'resp-', 'Bagian', i => { hiSeg = i; $$('.seg5', root).forEach((e, k) => e.classList.toggle('on', k === i)); }); }
    function wire3() { wireTiles(CONTOH17, 'contoh-', 'Contoh'); }
    function next() { if (slide === 0 && !chatDone) return; if (slide < 2) show(slide + 1, 'fwd'); else { S.seen.s17 = true; commit(); go('s18'); } }
    function back() { if (slide > 0) show(slide - 1, 'bwd'); else go('s05'); }
    bNext.onclick = next; $('#bBack', root).onclick = back; $('#bMenu', root).onclick = () => go('s05');
    let x0 = null;
    box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    box.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) { dx < 0 ? next() : back(); } }, { passive: true });
    const key = e => { if ($('#layer .layer-item')) return; if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') back(); };
    document.addEventListener('keydown', key); onLeave(() => { document.removeEventListener('keydown', key); stopChat(); });
    show(0);
  }
};

/* ================= S18 · Latihan 5: susun respons (drag the words, 2 item) ================= */
const IT18 = [
  { title: 'Menjawab pertanyaan harga', cust: 'Nastar 500 gram berapa harganya?', seed: 7,
    slots: [['Sapaan', 'Halo, Kak!'], ['Jawaban inti', 'Nastar 500 gram Rp85.000.'], ['Informasi pendukung', 'Pesanan minimal H-3.'], ['Ajakan tindak lanjut', 'Mau pesan berapa toples?'], ['Penutup', 'Terima kasih, Kak!']],
    decoy: { t: 'Nastar kami termurah se-Indonesia!', why: 'Janji ini tidak ada dalam informasi usaha, jadi chatbot tidak boleh mengatakannya.' } },
  { title: 'Mengalihkan keluhan ke CS manusia', cust: 'Pesanan saya rusak, minta ganti rugi!', seed: 31,
    slots: [['Ucapan terima kasih', 'Terima kasih sudah menghubungi kami.'], ['Pengalihan', 'Untuk hal ini, tim kami akan membantu langsung.'], ['Jam layanan', 'Pada jam layanan 08.00–17.00.']],
    decoy: { t: 'Kami akan memberi ganti rugi penuh.', why: 'Ganti rugi adalah keputusan pemilik. Chatbot tidak boleh menjanjikannya.' } }
];
SC.s18 = {
  render() {
    const A = ansOf('s18'), ok = A.it && A.it[0] && A.it[0].submitted && A.it[1] && A.it[1].submitted;
    return `<div class="stage">${headHTML('notebook-pen', 'Kartu D · Respons Chatbot', 'Latihan 5')}
      <div class="panel" id="ex"></div>${cardNavHTML('Lanjut', !ok)}</div>`;
  },
  init(root) {
    const A = ansOf('s18'); A.it = A.it || [{ place: {}, submitted: false }, { place: {}, submitted: false }]; A.cur = A.cur || 0;
    const host = $('#ex', root);
    const bothDone = () => A.it[0].submitted && A.it[1].submitted;
    const def = () => IT18[A.cur], st = () => A.it[A.cur];
    const words = d => [...d.slots.map((s, k) => ({ id: 'w' + k, t: s[1] })), { id: 'wd', t: d.decoy.t, decoy: true }];
    function draw() {
      const d = def(), s = st(), P = s.place, W = words(d), sub = s.submitted, n = d.slots.length;
      const order = seeded(W.length, d.seed), where = w => P[w.id] || 'bank';
      const rest = order.map(i => W[i]).filter(w => where(w) === 'bank'), inSlot = k => W.find(w => where(w) === 'b' + k);
      const word = w => `<span class="word" data-item="${w.id}" role="button" tabindex="${sub ? -1 : 0}" aria-pressed="false">${w.t}</span>`;
      const rows = d.slots.map((sl, k) => { const w = inSlot(k), ok = sub && w && w.id === 'w' + k, bad = sub && !ok;
        return `<div class="srow"><div class="lb">${sl[0]}</div><div class="blank ${w ? 'filled' : ''} ${ok ? 'ok' : ''} ${bad ? 'bad' : ''}" data-target="b${k}">${w ? word(w) : '<span>Seret atau ketuk kalimat di sini</span>'}
          ${sub ? `<span class="mk">${ic(ok ? 'circle-check' : 'circle-x')} ${ok ? 'Benar' : 'Salah'}</span>` : ''}${bad ? `<span class="fix">Seharusnya: ${sl[1]}</span>` : ''}</div></div>`; }).join('');
      const preview = d.slots.map((_, k) => { const w = inSlot(k); return w ? `<span class="pv">${w.t}</span>` : '<span class="pv empty">…</span>'; }).join(' ');
      let ev = '';
      if (sub) { const dw = W.find(w => w.decoy), dpl = where(dw) !== 'bank';
        ev = evalHead(s.score, n) + (dpl ? `<div class="rev bad"><span class="rn" aria-hidden="true">${ic('x')}</span><div><b>${d.decoy.t}</b><span class="tag2">Kalimat pengecoh</span><p>${d.decoy.why}</p></div></div>` : '') + '<div style="height:10px"></div>'; }
      host.className = 'panel' + (sub ? ' locked-dnd' : '');
      host.innerHTML = `<div class="itemtabs" role="tablist" aria-label="Item latihan">${IT18.map((x, i) => `<button role="tab" class="itab ${i === A.cur ? 'cur' : ''} ${A.it[i].submitted ? 'done' : ''}" data-it="${i}" aria-selected="${i === A.cur}" ${i === 1 && !A.it[0].submitted ? 'disabled' : ''}>${A.it[i].submitted ? ic('circle-check') : ''} Item ${i + 1}</button>`).join('')}</div>
        ${ev}<h2 class="sub" style="margin:4px 0 6px">${d.title}</h2>
        <p class="lead" style="margin-bottom:12px">Susun balasan chatbot dengan menempatkan kalimat pada bagian yang tepat. Satu kalimat adalah pengecoh.</p>
        <div class="s-grid" style="align-items:start">
          <div class="stack"><div class="custq"><span class="small muted">Pelanggan bertanya</span><p>“${d.cust}”</p></div>
            <div class="bank" data-target="bank"><h3>${ic('message-circle')} Bank kalimat <span class="muted small">(${rest.length} tersisa)</span></h3><div class="words">${rest.map(word).join('') || '<p class="empty">Semua kalimat sudah dipakai.</p>'}</div></div>
            <div class="msg bot pvw"><span class="tag">${ic('sparkles')} Pratinjau balasan</span><p>${preview}</p></div></div>
          <div class="paper"><div class="paper-h">${ic('message-circle', 'lg')}<div><b>Balasan chatbot</b><small>${n} bagian</small></div></div>${rows}</div>
        </div>
        <div class="actions"><span class="hint">${ic('info')} ${sub ? 'Jawaban Anda tersimpan di perangkat ini.' : rest.length > 1 ? `${rest.length - 1} kalimat belum ditempatkan.` : 'Siap diperiksa.'}</span>
          <div class="btns"><button class="btn btn-secondary" id="bReset" ${!sub && Object.keys(P).length === 0 ? 'disabled' : ''}>${ic('rotate-ccw')} Ulangi</button>
          ${sub ? (A.cur === 0 ? `<button class="btn btn-primary" id="bItem2">Item 2 ${ic('arrow-right')}</button>` : '') : `<button class="btn btn-primary" id="bCheck" ${n - Object.values(P).filter(v => v !== 'bank').length > 0 && Object.values(P).filter(v => v !== 'bank').length < n ? 'disabled' : ''}>Periksa</button>`}</div></div>`;
      $('#bNext', root).disabled = !bothDone();
    }
    const dnd = bindDnD(host, { isLocked: () => !!st().submitted, onMove: (id, t) => {
      const P = st().place;
      if (t !== 'bank') { const occ = Object.keys(P).find(k => k !== id && P[k] === t); if (occ) delete P[occ]; P[id] = t; } else delete P[id];
      save(); SFX.pop(); draw(); } });
    host.addEventListener('click', e => {
      const it = e.target.closest('[data-it]'); if (it && !it.disabled) { A.cur = +it.dataset.it; save(); dnd.clear(); draw(); return; }
      if (e.target.closest('#bCheck')) { const s = st(), P = s.place, d = def(); s.score = d.slots.filter((_, k) => P['w' + k] === 'b' + k).length; s.submitted = true; commit(); s.score / d.slots.length >= .7 ? SFX.ok() : SFX.no(); draw(); host.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); }
      if (e.target.closest('#bReset')) { const s = st(); s.place = {}; s.submitted = false; delete s.score; commit(); dnd.clear(); draw(); }
      if (e.target.closest('#bItem2')) { A.cur = 1; save(); dnd.clear(); draw(); host.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); }
    });
    draw();
    wireCardNav(root, { back: 's17', next: 's19', id: 's18' });
  }
};
