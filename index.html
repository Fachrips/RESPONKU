  --lock:#55546E; --lock-bg:#ECEBF3; --off-bg:#E6E3F2; --off-tx:#6B6A85;
  --r-sm:12px; --r-md:18px; --r-lg:26px; --r-xl:34px;
  --sh-sm:0 1px 2px rgba(27,27,58,.06),0 3px 10px rgba(27,27,58,.06);
  --sh-md:0 8px 28px rgba(70,48,168,.14);
  --sh-lg:0 18px 50px rgba(42,27,122,.22);
  --nav-h:64px;
  --f:'Poppins','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--f);font-size:16px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
img,svg{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #FFB020;outline-offset:3px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.25em;height:1.25em;flex:none}
.ic.lg{width:28px;height:28px}
.small{font-size:14px;line-height:1.5}
.muted{color:var(--ink2)}

/* ===== tombol ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:2px solid transparent;font-weight:600;font-size:16px;line-height:1.2;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;user-select:none;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--p600);color:#fff;box-shadow:0 6px 16px rgba(91,63,208,.32)}
.btn-primary:hover{background:var(--p700);transform:translateY(-1px)}
.btn-secondary{background:#fff;color:var(--p700);border-color:var(--p600)}
.btn-secondary:hover{background:var(--p50)}
.btn-ghost{color:var(--p700);padding:0 16px}
.btn-ghost:hover{background:var(--p100)}
.btn-nav{min-height:44px;padding:0 18px;background:#fff;border-color:var(--line-strong);color:var(--ink);font-weight:500}
.btn-nav:hover{background:var(--p50);border-color:var(--p600)}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--off-bg);color:var(--off-tx);border-color:transparent;box-shadow:none;cursor:not-allowed;transform:none}
.btn-icon{width:48px;padding:0}

/* ===== navbar + progres ===== */
.navbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-row{height:var(--nav-h);max-width:1360px;margin:0 auto;padding:0 clamp(12px,2.4vw,28px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.nav-right{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--ink);border-radius:14px;padding:4px 8px}
.brand img{width:40px;height:40px}
.brand b{color:var(--p600);font-weight:700}
.chip-prog{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;background:var(--p50);color:var(--p700);font-weight:600;font-size:14px;white-space:nowrap}
.chip-prog .ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--p600) calc(var(--pct,0)*1%),var(--p200) 0);position:relative}
.chip-prog .ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--p50)}
.pbar{display:flex;gap:4px;height:6px;padding:0 clamp(12px,2.4vw,28px) 0;max-width:1360px;margin:0 auto 0}
.pbar i{flex:1;background:var(--p100);border-radius:6px 6px 0 0;overflow:hidden;position:relative}
.pbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--p500),var(--p600));transform-origin:left;transform:scaleX(var(--f,0));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.pbar i.on::after{background:linear-gradient(90deg,#16915A,#12683E)}

/* ===== panggung scene ===== */
#app{min-height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:clamp(16px,2.6vw,36px) clamp(14px,2.6vw,32px) 0;display:flex;flex-direction:column;animation:scIn .35s ease both}
.stage.wide{max-width:1360px}
@keyframes scIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scene-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:clamp(14px,2vw,24px)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--p700);background:var(--p100);padding:4px 14px;border-radius:999px;margin-bottom:8px}
h1.title{font-size:clamp(1.65rem,1.2rem + 1.6vw,2.4rem);line-height:1.2;font-weight:700}
h2.sub{font-size:clamp(1.25rem,1rem + .9vw,1.7rem);line-height:1.3;font-weight:700}
.lead{font-size:clamp(16px,.9rem + .35vw,18px);color:var(--ink2);max-width:62ch}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:clamp(18px,2.4vw,32px)}
.scene-nav{position:sticky;bottom:0;z-index:30;margin-top:auto;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 72%,rgba(247,245,255,0))}
.scene-nav .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.scene-nav .row>:first-child{justify-self:start}.scene-nav .row>:last-child{justify-self:end}
.scene-nav.single .row{grid-template-columns:1fr;justify-items:end}

/* ===== S01 hero ===== */
.hero{position:relative;min-height:100dvh;overflow:hidden;background:linear-gradient(135deg,#F9F7FF 0%,#EEE7FF 52%,#DED2FF 100%)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}
.hero::before{width:520px;height:520px;right:-120px;top:-140px;background:radial-gradient(circle,rgba(110,79,232,.30),rgba(110,79,232,0) 68%)}
.hero::after{width:460px;height:460px;left:-140px;bottom:-160px;background:radial-gradient(circle,rgba(255,200,87,.34),rgba(255,200,87,0) 66%)}
.hero-in{position:relative;z-index:1;max-width:1240px;margin:0 auto;min-height:100dvh;padding:clamp(18px,3vw,36px) clamp(18px,3vw,40px);display:grid;grid-template-columns:1.1fr .9fr;grid-template-rows:auto 1fr;gap:0 clamp(24px,5vw,72px)}
.logos{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.logos .lg-chip{width:54px;height:54px;border-radius:16px;background:#fff;box-shadow:var(--sh-sm);display:grid;place-items:center;padding:7px}
.logos .lg-chip img{width:100%;height:100%;object-fit:contain}
.logos span{font-size:14px;color:var(--ink2);line-height:1.35;max-width:26ch}
.hero-copy{align-self:center;padding:clamp(12px,3vh,32px) 0}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--p700);font-weight:600;font-size:14px;padding:6px 16px;border-radius:999px;box-shadow:var(--sh-sm)}
.hero-logo{display:flex;align-items:center;gap:clamp(12px,2vw,20px);margin:18px 0 14px}
.hero-logo img{width:clamp(64px,9vw,96px);height:auto}
.hero h1{font-size:clamp(2.5rem,1.4rem + 5.2vw,4.6rem);line-height:1;font-weight:700;letter-spacing:.01em}
.hero h1 b{color:var(--p600);font-weight:700}
.hero p.tag{font-size:clamp(17px,1rem + .5vw,21px);max-width:30ch;line-height:1.45;font-weight:500}
.hero p.aud{margin-top:10px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.hero-cta{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;min-height:56px}
.btn-lg{min-height:56px;padding:0 34px;font-size:18px}
.rv{opacity:0;transform:translateY(14px);animation:rv .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rv{to{opacity:1;transform:none}}
.hero-cta .btn{opacity:0;transform:translateY(10px) scale(.96);pointer-events:none;transition:opacity .5s,transform .5s}
.hero-cta.ready .btn{opacity:1;transform:none;pointer-events:auto}
.hero-cta.ready .btn-primary{animation:pulse 2.4s 1s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(91,63,208,.14),0 6px 16px rgba(91,63,208,.32)}}
.hero-phone{align-self:center;justify-self:center;width:100%;display:flex;justify-content:center;padding:12px 0}

/* ===== ponsel + chat ===== */
.phone{width:min(100%,336px);border-radius:38px;background:#fff;border:8px solid var(--ink);box-shadow:var(--sh-lg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.phone-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,var(--p600),var(--p900));color:#fff}
.phone-top .av{width:38px;height:38px;border-radius:50%;background:var(--amber);color:var(--p900);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
.phone-top strong{display:block;font-size:14.5px;line-height:1.25;font-weight:600}
.phone-top small{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
.phone-top small::before{content:"";width:8px;height:8px;border-radius:50%;background:#6FE3A4}
.chat-body{height:clamp(300px,52vh,420px);overflow-y:auto;padding:14px 12px 16px;display:flex;flex-direction:column;gap:8px;background-color:#EFE9FD;background-image:radial-gradient(rgba(91,63,208,.07) 1.2px,transparent 1.4px);background-size:18px 18px;scroll-behavior:smooth}
.chat-body.tall{height:clamp(320px,56vh,440px)}
.msg{max-width:84%;padding:8px 12px 6px;border-radius:16px;font-size:15px;line-height:1.45;box-shadow:0 1px 1px rgba(27,27,58,.08);animation:msgIn .32s cubic-bezier(.2,.8,.2,1) both}
.msg p{margin:0}
.msg.cust{align-self:flex-start;background:#fff;border-top-left-radius:4px}
.msg.bot{align-self:flex-end;background:#D3F0E1;border-top-right-radius:4px}
.msg.owner{align-self:flex-end;background:#FFEBD2;border-top-right-radius:4px}
.msg .tag{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;margin-bottom:2px;color:var(--ok)}
.msg.owner .tag{color:var(--warn)}
.msg .tag .ic{width:13px;height:13px}
.msg time{display:block;text-align:right;font-size:12px;color:var(--ink2);margin-top:1px}
.sys{align-self:center;font-size:12.5px;font-weight:500;color:var(--ink2);background:rgba(255,255,255,.85);padding:3px 12px;border-radius:999px;animation:msgIn .3s both}
.typing{align-self:flex-end;background:#D3F0E1;border-radius:16px;border-top-right-radius:4px;padding:11px 14px;display:flex;gap:5px;animation:msgIn .25s both}
.typing.l{align-self:flex-start;background:#fff;border-radius:16px;border-top-left-radius:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink2);opacity:.5;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-4px);opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:14px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:1px solid rgba(27,27,58,.15)}

/* ===== S02 / S05 kartu ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:clamp(14px,2.4vw,28px)}
.topbar .btns{display:flex;gap:10px}
.hub-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(16px,2.4vw,26px)}
.hub-head .lead{margin-top:8px}
.sumcard{display:flex;flex-direction:column;gap:8px;min-width:min(100%,300px);background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 18px;box-shadow:var(--sh-sm)}
.sumcard .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}
.sumcard .pbar{padding:0;height:10px;gap:4px}
.sumcard .pbar i{border-radius:6px}
.grid{display:grid;gap:clamp(12px,1.8vw,20px)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.cm{position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:clamp(16px,1.8vw,24px);box-shadow:var(--sh-sm);transition:transform .2s,box-shadow .2s,border-color .2s;min-height:176px;width:100%}
.cm:hover{transform:translateY(-4px);box-shadow:var(--sh-md);border-color:var(--p500)}
.cm .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:var(--p700);background:var(--lav)}
.cm .ico .ic{width:26px;height:26px}
.cm h3{font-size:clamp(18px,1.1rem + .3vw,21px);font-weight:700;line-height:1.3}
.cm .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2);align-items:center}
.cm .meta span{display:inline-flex;align-items:center;gap:6px}
.cm .desc{font-size:15.5px;color:var(--ink2);line-height:1.5}
.cm .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;color:var(--p700);font-weight:600;font-size:15px}
.cm .go .ic{transition:transform .2s}.cm:hover .go .ic{transform:translateX(4px)}
.cm.t-krem .ico{background:var(--krem)}.cm.t-pink .ico{background:var(--pink)}.cm.t-biru .ico{background:var(--biru)}.cm.t-mint .ico{background:var(--mint)}.cm.t-rose .ico{background:var(--rose)}
.badge{position:absolute;top:16px;right:16px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:3px 12px;border-radius:999px}
.badge .ic{width:16px;height:16px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.lock{background:#fff;color:var(--lock);border:1.5px dashed var(--line-strong)}
.badge.rec{background:var(--p600);color:#fff}
.cm.rec{border-color:var(--p600);box-shadow:0 0 0 4px var(--p100),var(--sh-sm)}
.cm.locked{background:var(--lock-bg);border:1.5px dashed var(--line-strong);box-shadow:none}
.cm.locked .ico{background:#fff;color:var(--lock)}
.cm.locked:hover{transform:none;box-shadow:none;border-color:var(--lock)}
.cm.locked h3,.cm.locked .desc{color:var(--lock)}
.cm.locked .go{color:var(--lock)}
.cm.done{border-color:#9FD8B8}
.letter{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--p700);background:var(--lav)}
.cm.t-krem .letter{background:var(--krem)}.cm.t-pink .letter{background:var(--pink)}.cm.t-biru .letter{background:var(--biru)}.cm.t-mint .letter{background:var(--mint)}
.cm.big{min-height:196px}
.contents{font-size:14px;color:var(--ink2);line-height:1.5;border-top:1px dashed var(--line);padding-top:10px}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--p50);border:1px solid var(--p200);color:var(--p900);border-radius:var(--r-md);padding:12px 16px;font-size:15px}
.note .ic{margin-top:3px;color:var(--p600)}
.note.warn{background:var(--warn-bg);border-color:#F2D694;color:var(--warn)}.note.warn .ic{color:var(--warn)}

/* ===== S03 petunjuk ===== */
.two{display:grid;grid-template-columns:1.45fr 1fr;gap:clamp(14px,2vw,24px);align-items:start}
.leg-g{margin-bottom:18px}.leg-g:last-child{margin-bottom:0}
.leg-g h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:10px}
.leg-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
.leg{display:flex;align-items:center;gap:12px;min-width:0}
.leg .mock{flex:none;min-width:84px;display:flex;justify-content:center}
.leg .mock .btn{min-height:38px;padding:0 14px;font-size:14px;pointer-events:none}
.leg .mock img{width:34px;height:34px}
.leg b{display:block;font-size:15.5px;line-height:1.3}
.leg span.d{font-size:14px;color:var(--ink2);line-height:1.35;display:block}
.mini-bar{display:flex;gap:3px;width:78px}.mini-bar i{flex:1;height:8px;border-radius:4px;background:var(--p100)}.mini-bar i:nth-child(-n+3){background:var(--p600)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:3px 12px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.lock{background:#fff;color:var(--lock);border:1.5px dashed var(--line-strong)}.pill .ic{width:16px;height:16px}
.pre li{display:flex;gap:10px;align-items:center;padding:6px 0}
.pre ul{list-style:none;margin:0;padding:0}
.pre .ic{color:var(--ok)}
.stack{display:flex;flex-direction:column;gap:14px}
.audio-btn{width:100%;min-height:58px;font-size:17px}
.wave{display:none;gap:3px;align-items:center;height:18px}.playing .wave{display:inline-flex}
.wave i{width:3px;background:#fff;border-radius:2px;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(1){height:6px}.wave i:nth-child(2){height:14px;animation-delay:.15s}.wave i:nth-child(3){height:9px;animation-delay:.3s}.wave i:nth-child(4){height:16px;animation-delay:.45s}
@keyframes wv{50%{transform:scaleY(.4)}}
details.tx{border:1px solid var(--line);border-radius:var(--r-md);background:#fff;padding:0 16px}
details.tx summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;font-weight:600;color:var(--p700)}
details.tx summary::-webkit-details-marker{display:none}
details.tx[open] summary .ic{transform:rotate(180deg)}
details.tx p{padding:0 0 16px;font-size:15.5px;color:var(--ink2)}

/* ===== S04 tujuan ===== */
.obj-main{background:linear-gradient(145deg,var(--p600),var(--p900));color:#fff;border-radius:var(--r-lg);padding:clamp(20px,2.6vw,34px);box-shadow:var(--sh-md);position:sticky;top:calc(var(--nav-h) + 24px)}
.obj-main .eyebrow{background:rgba(255,255,255,.16);color:#fff}
.obj-main p{font-size:clamp(17px,1rem + .5vw,21px);line-height:1.55;font-weight:500}
.obj-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.obj{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;box-shadow:var(--sh-sm);opacity:0;transform:translateX(18px);transition:opacity .45s,transform .45s}
.obj.in{opacity:1;transform:none}
.obj .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--p100);color:var(--p700);font-weight:700;display:grid;place-items:center}
.obj p{flex:1;font-size:16px;line-height:1.4}
.obj .kc{flex:none;font-size:14px;font-weight:600;color:var(--p700);background:var(--p50);padding:2px 12px;border-radius:999px;white-space:nowrap}

/* ===== slide S06 ===== */
.slidebox{position:relative;overflow:hidden;min-height:min(520px,60vh)}
.slide{animation:none}
.slide.fwd{animation:sFwd .4s cubic-bezier(.2,.8,.2,1) both}.slide.bwd{animation:sBwd .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes sFwd{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sBwd{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:8px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--p200);transition:all .25s}
.dots i.on{width:30px;border-radius:6px;background:var(--p600)}
.dots-wrap{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--ink2)}
.s-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,44px);align-items:center}
.s-grid.rev{grid-template-columns:1fr 1fr}
.def{background:var(--p50);border:1px solid var(--p200);border-radius:var(--r-lg);padding:clamp(18px,2.4vw,30px)}
.def .q{font-size:clamp(17px,1rem + .45vw,21px);line-height:1.6;font-weight:500;color:var(--ink)}
.def .q mark{background:linear-gradient(transparent 62%,rgba(255,200,87,.7) 0);color:inherit;font-weight:700}
.def cite{display:block;margin-top:14px;font-size:14px;font-style:normal;color:var(--ink2)}
.tiles{display:flex;flex-direction:column;gap:12px}
.tiles h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.tile{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:76px;padding:14px 18px;border-radius:var(--r-md);background:var(--lav);border:2px solid transparent;transition:transform .15s,box-shadow .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--p500)}
.tile .ti{flex:none;width:46px;height:46px;border-radius:14px;background:#fff;color:var(--p700);display:grid;place-items:center}
.tile b{display:block;font-size:17.5px;line-height:1.3}
.tile small{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .tx{flex:1;min-width:0}
.tile .ch{flex:none;color:var(--p700)}
.tile.t2{background:var(--krem)}.tile.t3{background:var(--mint)}
.tile.seen small{color:var(--ok);font-weight:600}
.status{min-height:26px;font-size:15px;font-weight:500;color:var(--p700);display:flex;align-items:center;gap:8px}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* ===== laci menu ===== */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(27,27,58,.5);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;z-index:61;top:0;bottom:0;left:0;width:min(88vw,360px);background:#fff;box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:dIn .3s cubic-bezier(.2,.8,.2,1) both;overflow-y:auto}
@keyframes dIn{from{transform:translateX(-100%)}}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 8px;font-size:14px;letter-spacing:.08em;font-weight:600;color:var(--ink2)}
.drawer nav{padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.dnav{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 12px;border-radius:14px;font-size:17px;font-weight:500;text-align:left;width:100%}
.dnav:hover{background:var(--p50)}
.dnav .ic{color:var(--p600)}
.dnav .pill{margin-left:auto}
.dnav[aria-current="page"]{background:var(--p100);font-weight:600}
.drawer footer{margin-top:auto;padding:16px 20px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}

/* ===== pop up ===== */
.modal-wrap{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px}
.modal-wrap .scrim{z-index:0}
.modal{position:relative;z-index:1;width:min(100%,520px);max-height:calc(100dvh - 32px);overflow-y:auto;background:#fff;border-radius:var(--r-xl);box-shadow:var(--sh-lg);padding:clamp(22px,3vw,32px);animation:mIn .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes mIn{from{opacity:0;transform:translateY(18px) scale(.96)}}
.modal .x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.modal .x:hover{background:var(--p50)}
.modal .mi{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--lav);color:var(--p700);margin-bottom:14px}
.modal .mi .ic{width:32px;height:32px}
.modal h2{font-size:clamp(1.3rem,1.1rem + .8vw,1.65rem);line-height:1.25;font-weight:700;margin:6px 0 10px;padding-right:36px}
.modal .body{font-size:16.5px;color:var(--ink2);line-height:1.6}
.modal .ex{margin-top:16px;background:#EFE9FD;border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px}
.modal .ex .msg{max-width:92%}
.modal-foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:22px}
.modal-foot .btn{min-height:46px;padding:0 18px}
.modal-foot>:first-child{justify-self:start}.modal-foot>:last-child{justify-self:end}
.notice{text-align:center;padding-top:34px;max-width:440px}
.notice .alert{width:76px;height:76px;margin:0 auto 16px;border-radius:50%;border:4px solid #D93A4F;color:#D93A4F;display:grid;place-items:center;background:#fff;animation:shake .5s .2s both}
.notice .alert .ic{width:38px;height:38px}
@keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.notice h2{padding-right:0}
.notice .acts{display:flex;flex-direction:column;gap:8px;margin-top:22px;align-items:stretch}
.modal-wrap.clear .scrim{background:rgba(27,27,58,.34);backdrop-filter:blur(2px)}

/* ===== toast ===== */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;width:min(calc(100% - 28px),520px);display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border:1px solid #F2D694;border-radius:var(--r-md);padding:14px 18px;box-shadow:var(--sh-lg);font-weight:500;animation:tIn .35s cubic-bezier(.2,.8,.2,1) both}
.toast .ic{margin-top:3px}
@keyframes tIn{from{opacity:0;transform:translate(-50%,16px)}}
.toast.out{opacity:0;transition:opacity .3s}

/* ===== placeholder + dev ===== */
.soon{margin:auto;text-align:center;max-width:520px;padding:clamp(28px,4vw,48px)}
.soon .mi{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;background:var(--krem);color:var(--warn);display:grid;place-items:center}
.soon .mi .ic{width:36px;height:36px}
.dev{position:fixed;left:12px;bottom:12px;z-index:90;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:13px;box-shadow:var(--sh-lg)}
.dev button{background:#fff;color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}

/* ===== responsif ===== */

  .btn-nav{padding:0 12px}

  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

}

.modal .mi.t-krem{background:var(--krem)}.modal .mi.t-mint{background:var(--mint)}.modal .mi.t-biru{background:var(--biru)}

/* ===== RESPONKU · komponen S07 sampai S12 ===== */
.exnote{margin-top:14px;border-left:4px solid var(--p500);background:var(--p50);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 16px}
.exnote .small{font-weight:600;color:var(--p700)}.exnote p{font-weight:500;color:var(--ink)}
.ring.big{width:88px;height:88px;display:grid;place-items:center;flex:none;border-radius:50%;position:relative;background:conic-gradient(var(--c,var(--p600)) calc(var(--pct,0)*1%),var(--p200) 0)}
.ring.big::after{content:"";position:absolute;border-radius:50%}
.ring.big::after{inset:9px;background:#fff}
.ring.big b{position:relative;z-index:1;font-size:26px;font-weight:700}
.row-gap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.actions .hint{font-size:15px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.actions .btns{display:flex;gap:10px;flex-wrap:wrap}

/* --- S07 alur + accordion --- */
.banner2{display:flex;flex-direction:column;gap:6px;padding:14px 20px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--p600),var(--p900));color:#fff;font-weight:500;font-size:clamp(16px,.95rem + .3vw,18px)}
.banner2 span{display:flex;gap:10px;align-items:flex-start}.banner2 .ic{margin-top:4px;color:var(--amber)}
.flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:16px;background:var(--p50);border:1px solid var(--p200);border-radius:var(--r-lg)}
.node{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:600;font-size:16px;transition:all .25s}
.node .ic{color:var(--p600)}
.node.hi{border-color:var(--p600);background:var(--p100);box-shadow:0 0 0 4px rgba(91,63,208,.14)}
.flow.has-open .node:not(.hi){opacity:.5}
.flow .arrow{color:var(--p500)}
.branch{display:flex;flex-direction:column;gap:8px}
.acc{display:flex;flex-direction:column;gap:12px}
.acc-item{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-sm);overflow:hidden;transition:border-color .2s}
.acc-item.open{border-color:var(--p500)}
.acc-h{width:100%;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 18px;text-align:left;font-weight:600;font-size:clamp(16.5px,1rem + .2vw,18px)}
.acc-h:hover{background:var(--p50)}
.acc-h .ti{flex:none;width:44px;height:44px;border-radius:14px;background:var(--lav);color:var(--p700);display:grid;place-items:center}
.acc-item:nth-child(2) .ti{background:var(--krem)}.acc-item:nth-child(3) .ti{background:var(--mint)}
.acc-h .chev{margin-left:auto;transition:transform .25s;color:var(--p700)}
.acc-item.open .chev{transform:rotate(180deg)}
.acc-h small{display:block;font-weight:500;color:var(--ink2);font-size:14px}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc-item.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden;visibility:hidden;transition:visibility .3s}
.acc-item.open .acc-b>div{visibility:visible}
.acc-b .in{padding:2px 20px 18px 76px;color:var(--ink2);font-size:16.5px}
.acc-b .in ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.acc-b .in cite{display:block;margin-top:8px;font-size:14px;font-style:normal}

/* --- latihan pilihan ganda --- */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qchips{display:flex;gap:8px}
.qchip{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);font-weight:700;background:#fff;color:var(--ink2);display:grid;place-items:center;position:relative}
.qchip.cur{border-color:var(--p600);color:var(--p700);background:var(--p100)}
.qchip.ans{background:var(--p600);border-color:var(--p600);color:#fff}
.qchip.ok{background:var(--ok);border-color:var(--ok);color:#fff}.qchip.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.qchip.cur{box-shadow:0 0 0 4px rgba(91,63,208,.2)}
.qtext{font-size:clamp(18px,1rem + .6vw,22px);font-weight:600;line-height:1.5;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;border-radius:var(--r-md);border:2px solid var(--line);background:#fff;text-align:left;font-size:clamp(16px,.95rem + .2vw,17.5px);line-height:1.45;transition:all .15s}
.opt:hover:not([disabled]){border-color:var(--p500);background:var(--p50)}
.opt .let{flex:none;width:34px;height:34px;border-radius:50%;background:var(--p100);color:var(--p700);display:grid;place-items:center;font-weight:700;font-size:15px}
.opt.sel{border-color:var(--p600);background:var(--p50)}.opt.sel .let{background:var(--p600);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .let{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .let{background:var(--bad);color:#fff}
.opt.key{border-color:var(--ok);border-style:dashed}
.opt .st{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.opt.ok .st{color:var(--ok)}.opt.bad .st{color:var(--bad)}.opt.key .st{color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 16px;border-radius:var(--r-md);font-size:16px;line-height:1.5}
.fb .ic{margin-top:3px;flex:none}
.fb.ok{background:var(--ok-bg);border:1px solid #9FD8B8}.fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid #F2A9B8}.fb.bad b{color:var(--bad)}
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.evalhead{display:flex;gap:20px;align-items:center;padding:18px 22px;border-radius:var(--r-lg);background:var(--p50);border:1px solid var(--p200);margin-bottom:14px}
.evalhead.ok{background:var(--ok-bg);border-color:#9FD8B8}.evalhead.ok .ring{--c:var(--ok)}
.evalhead.warn{background:var(--warn-bg);border-color:#F2D694}.evalhead.warn .ring{--c:var(--warn)}
.evalhead h3{font-size:clamp(1.2rem,1rem + .6vw,1.5rem);line-height:1.2;margin-bottom:4px}
.evalhead p{font-size:16px;line-height:1.5}
.rev{display:flex;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}
.rev .rn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.rev.ok .rn{background:var(--ok)}.rev.bad .rn{background:var(--bad)}
.rev b{display:block;font-weight:600;line-height:1.4;margin-bottom:2px}
.rev .tag2{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600;margin:2px 0}
.rev.ok .tag2{color:var(--ok)}.rev.bad .tag2{color:var(--bad)}
.rev p{font-size:15.5px;color:var(--ink2);line-height:1.5}

/* --- S09 kartu balik --- */
.seg{display:inline-flex;background:var(--p100);border-radius:999px;padding:4px;gap:2px;max-width:100%;flex-wrap:wrap}
.seg button{min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;color:var(--p700);display:inline-flex;align-items:center;gap:8px;font-size:15.5px}
.seg button[aria-selected="true"]{background:#fff;box-shadow:var(--sh-sm);color:var(--ink)}
.fdeck{perspective:1400px}
.fcard{position:relative;display:block;width:100%;min-height:300px;text-align:left;border-radius:var(--r-lg)}
.fc-in{display:block;position:relative;width:100%;min-height:300px;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fcard.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-lg);padding:clamp(18px,2.4vw,28px);display:flex;flex-direction:column;gap:12px;border:2px solid var(--line);background:#fff;box-shadow:var(--sh-md)}
.face.back{transform:rotateY(180deg)}
.face.back.cocok{background:var(--mint);border-color:#8FD1AE}.face.back.alih{background:var(--krem);border-color:#EBC088}
.face .q{font-size:clamp(20px,1rem + 1vw,26px);font-weight:600;line-height:1.4;margin:auto 0}
.face .hint{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-top:auto}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px;padding:4px 14px;border-radius:999px;background:#fff;align-self:flex-start}
.cocok .verdict{color:var(--ok)}.alih .verdict{color:var(--warn)}
.face.back p{font-size:clamp(17px,1rem + .3vw,19px);line-height:1.55;margin:auto 0}
.decknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:500;padding:4px 12px;border-radius:999px;background:var(--p50);border:1px solid var(--p200)}
.cat.alih{background:var(--krem);border-color:#EBC088}.cat.cocok{background:var(--mint);border-color:#8FD1AE}
.tipbox{background:var(--warn-bg);border:1px solid #F2D694;border-radius:var(--r-md);padding:16px 18px}
.tipbox b{display:flex;gap:8px;align-items:center;color:var(--warn);margin-bottom:6px}
.tipbox p{font-size:17px;font-weight:500;line-height:1.5}

/* --- seret dan lepas --- */
.dcard{display:flex;align-items:center;gap:8px;min-height:52px;padding:10px 12px;border-radius:14px;background:#fff;border:2px solid var(--line);box-shadow:var(--sh-sm);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:16px;line-height:1.35;text-align:left}
.dcard .grip{color:var(--line-strong);flex:none}
.dcard.selected{border-color:var(--p600);background:var(--p100);box-shadow:0 0 0 4px rgba(91,63,208,.18)}
.dcard.dragging,.word.dragging{opacity:.3}
.dcard.ok{border-color:var(--ok);background:var(--ok-bg)}.dcard.bad{border-color:var(--bad);background:var(--bad-bg)}
.dcard .mk{margin-left:auto;flex:none;display:flex;align-items:center;gap:4px;font-weight:600;font-size:14px}
.dcard.ok .mk{color:var(--ok)}.dcard.bad .mk{color:var(--bad)}

.statusrow .swb{flex-direction:row;align-items:center;gap:14px;font-size:17px}

.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(28px)}
.tabs7{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.tabs7 .tp{width:auto;flex-direction:row;align-items:center;gap:8px;font-weight:600}
.hist{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:16px;animation:fadeUp .4s both}
.hist li:nth-child(2){animation-delay:.12s}.hist li:nth-child(3){animation-delay:.24s}
.hist em{font-style:normal;font-weight:700;font-size:14px;border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px}.hist em .ic{width:14px;height:14px}
.hist .g{background:var(--ok-bg);color:var(--ok)}.hist .w{background:var(--warn-bg);color:var(--warn)}.hist .flag{border-color:#F2D694}
/* efek ketukan */
.ripple{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(91,63,208,.4);transform:translate(-50%,-50%) scale(0);animation:rip .6s ease-out forwards;pointer-events:none;z-index:4}
.ripple.good{background:rgba(31,157,99,.45)}
@keyframes rip{to{transform:translate(-50%,-50%) scale(7);opacity:0}}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:4;animation:spk .8s ease-out forwards}
@keyframes spk{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3)}}
.shk{animation:shk .42s}@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.spot{border-color:var(--p600)!important;animation:spot 1s ease-in-out infinite;position:relative;z-index:2}
@keyframes spot{0%,100%{box-shadow:0 0 0 0 rgba(91,63,208,.5)}50%{box-shadow:0 0 0 12px rgba(91,63,208,0)}}
.hand{position:absolute;left:0;top:0;z-index:6;width:40px;height:40px;pointer-events:none;color:#1B1B3A;transition:transform .95s cubic-bezier(.3,.8,.2,1);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.hand[hidden]{display:none}.hand .ic{width:40px;height:40px;fill:#fff;stroke-width:1.8}.hand.tap .ic{animation:htap .5s ease 3}
@keyframes htap{50%{transform:scale(.78)}}
/* panel */
.simp{position:sticky;top:92px;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);box-shadow:var(--sh-sm)}
.simtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg7{display:flex;gap:4px;flex:1;max-width:170px}.seg7 i{flex:1;height:8px;border-radius:4px;background:var(--p100);transition:background .4s}.seg7 i.cur{background:var(--p400,#8C74E8)}.seg7 i.on{background:var(--ok)}
.simp h2{font-size:clamp(1.1rem,1rem + .5vw,1.3rem);line-height:1.3}.task{font-size:16px;line-height:1.55;margin:0;color:var(--ink)}
.simfb{min-height:76px}.sf{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);font-size:16px;line-height:1.5;animation:fadeUp .3s both}
.sf .ic{margin-top:3px;flex:none}.sf.ok{background:var(--ok-bg);border:1px solid #9FD8B8}.sf.ok .ic{color:var(--ok)}
.sf.bad{background:var(--bad-bg);border:1px solid #F2A9B8}.sf.bad .ic{color:var(--bad)}.sf.hint{background:var(--warn-bg);border:1px solid #F2D694}.sf.hint .ic{color:var(--warn)}
.sf.info{background:var(--p50);border:1px solid var(--p200)}.sf.info .ic{color:var(--p600)}.sf.big{animation:fadeUp .5s both,pop .5s}
@keyframes pop{50%{transform:scale(1.03)}}
.simctl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.arrows{display:flex;gap:8px}.arrows .btn{min-height:48px}
.sheetd{margin:10px 0 0;display:flex;flex-direction:column;gap:8px}.sheetd>div{display:flex;gap:12px;padding:10px 12px;border-radius:12px;background:var(--p50)}
.sheetd dt{font-weight:700;min-width:120px;font-size:16px}.sheetd dd{margin:0;font-size:16px}
@media (max-width:980px){.sim-grid{grid-template-columns:1fr}.simp{position:static;order:-1}.mock-body{min-height:340px}}
@media (max-width:640px){.docs{grid-template-columns:1fr}.s6{grid-template-columns:1fr}.mock-body{padding:14px}.sheetd>div{flex-direction:column;gap:2px}}
@media (prefers-reduced-motion:reduce){.qr,.late,.rb i,.reply,.typing,.spotarea,.spot{animation:none!important}.qr{display:none}.late{opacity:1}.typing{display:none}}
.scanning{animation:typeOut .2s 1.45s forwards}
.simp{scroll-margin-top:84px}.tmsg{display:flex;gap:10px;align-items:flex-start;text-align:left}.tmsg .ic{margin-top:3px;flex:none}
/* ===== S15 revisi visual + S16–S18 ===== */
/* perbaikan: .lb S15 tidak boleh mengubah label baris isian (S12, S18) */
.srow .lb{margin:0;font-size:15.5px;color:var(--ink);font-weight:600}

/* ---------- S15: panggung, sidebar, lencana, perayaan ---------- */
.simstage{--sc:#5B3FD0;position:relative;padding:clamp(14px,2.4vw,26px);border-radius:28px;overflow:hidden;isolation:isolate;
  background:linear-gradient(135deg,#F3EEFF 0%,#FFF3E2 52%,#E6F6EC 100%);border:1px solid var(--p200)}
.simstage .blobs{position:absolute;inset:0;z-index:-1;overflow:hidden;border-radius:inherit;pointer-events:none}
.simstage .blob{position:absolute;border-radius:50%;pointer-events:none;animation:blobf 11s ease-in-out infinite}
.simstage .b1{width:260px;height:260px;left:-90px;top:-80px;background:radial-gradient(circle,rgba(110,79,232,.28),transparent 70%)}
.simstage .b2{width:300px;height:300px;right:-100px;bottom:-110px;background:radial-gradient(circle,rgba(245,158,11,.26),transparent 70%);animation-delay:-4s}
.simstage .b3{width:200px;height:200px;right:30%;top:-90px;background:radial-gradient(circle,rgba(31,157,99,.2),transparent 70%);animation-delay:-7s}
@keyframes blobf{50%{transform:translate(16px,12px) scale(1.06)}}
.simstage .mock{border-color:#fff;box-shadow:0 18px 46px rgba(42,27,122,.2),0 2px 0 rgba(255,255,255,.8) inset}
.mshell{display:grid;grid-template-columns:172px minmax(0,1fr)}
.msb{background:linear-gradient(180deg,#2A1B7A,#1B1245);color:#fff;padding:14px 10px 18px;display:flex;flex-direction:column;gap:4px}
.msb .brand{display:flex;align-items:center;gap:8px;padding:6px 8px 16px;font-size:15.5px}
.msb .brand .ic{color:#C8B9FF;width:22px;height:22px}
.msb .si{position:relative;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:10px;font-size:15px;color:#B9B2E3;transition:background .3s,color .3s}
.msb .si .ic{width:18px;height:18px;flex:none}
.msb .si em{margin-left:auto;display:none;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-style:normal}
.msb .si em .ic{width:12px;height:12px;stroke-width:3}
.msb .si.ok{color:#E9E5FF}.msb .si.ok em{display:grid}
.msb .si.cur{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.msb .si.cur::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--sc);filter:brightness(1.5)}
.mmain{display:flex;flex-direction:column;min-width:0}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink2)}
.mhead .crumb{display:flex;align-items:center;gap:6px}.mhead .crumb .ic{width:14px;height:14px}.mhead .crumb b{color:var(--ink)}
.mhead .av{width:32px;height:32px;border-radius:50%;background:var(--sc);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;transition:background .4s;box-shadow:none}
.mmain .mock-body{flex:1;min-height:420px}
.simstage .simp{border-top:5px solid var(--sc);transition:border-color .4s}
.simstage .seg7 i.cur{background:var(--sc)}
.sttrow{display:flex;align-items:center;gap:12px}
.sic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--p100);background:color-mix(in srgb,var(--sc) 14%,#fff);color:var(--sc);transition:background .4s,color .4s}
.sic .ic{width:24px;height:24px}
.sttrow h2{flex:1;min-width:0}
.cele{position:absolute;inset:0;z-index:8;display:grid;place-items:center;overflow:hidden;pointer-events:none;background:rgba(27,18,69,.34);animation:fadeIn .3s both}
.cele[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cbox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:min(86%,380px);padding:22px 26px;border-radius:24px;background:#fff;box-shadow:var(--sh-lg);animation:popIn .55s cubic-bezier(.3,1.5,.5,1) both}
.cbox .ic{width:44px;height:44px;color:#F59E0B}.cbox b{font-size:19px;line-height:1.3}.cbox span{font-size:15.5px;color:var(--ink2)}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.cf{position:absolute;top:-16px;width:var(--w);height:calc(var(--w)*1.7);border-radius:2px;transform:rotate(var(--r));animation:cfall 2.8s var(--d) ease-in forwards}
@keyframes cfall{to{transform:translate(var(--x),560px) rotate(calc(var(--r) + 560deg))}}
@media (max-width:980px){.mmain .mock-body{min-height:360px}}
@media (max-width:640px){
  .simstage{border-radius:20px;padding:10px}
  .mshell{grid-template-columns:1fr}
  .msb{flex-direction:row;overflow-x:auto;padding:8px;gap:4px;justify-content:space-between}
  .msb .brand,.msb .si span,.msb .si em{display:none!important}
  .msb .si{padding:10px;flex:1;justify-content:center}.msb .si.cur::before{left:8px;right:8px;top:auto;bottom:2px;width:auto;height:3px;border-radius:3px}
  .msb .si.ok{box-shadow:inset 0 -3px 0 var(--ok)}
  .mhead{padding:8px 14px}
}
@media (prefers-reduced-motion:reduce){.simstage .blob,.cf{animation:none!important}.cbox{animation:none}}

/* ---------- S16: urutkan 7 langkah ---------- */
.numbar{position:sticky;top:calc(var(--nav-h) + 8px);z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 14px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-sm)}
.numbar .small{font-weight:600;color:var(--ink2);margin-right:2px}
.nb{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid var(--p200);font-weight:700;font-size:17px;color:var(--p700);transition:transform .15s,background .15s,border-color .15s}
.nb:hover{transform:translateY(-2px);border-color:var(--p600)}
.nb.on{background:var(--p600);border-color:var(--p600);color:#fff}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slotrow{display:flex;align-items:center;gap:10px}
.slotrow .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--p600);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px}
.slotz{flex:1;min-width:0;min-height:62px;display:flex;align-items:center;padding:5px;border:2px dashed var(--line-strong);border-radius:16px;background:var(--paper);transition:border-color .2s,background .2s}
.slotz.f{border-style:solid;border-color:var(--p500);background:#fff;padding:3px}
.slotz .dcard{width:100%;box-shadow:none;border-color:transparent}
.slotz .empty{padding:4px 10px}
.ci{flex:none;width:34px;height:34px;border-radius:10px;background:var(--p100);color:var(--p700);display:grid;place-items:center}
.ci .ic{width:18px;height:18px}
.dcard.ok .ci{background:#fff;color:var(--ok)}.dcard.bad .ci{background:#fff;color:var(--bad)}
.keyd{margin:0 0 14px;padding:4px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff}
.keyd summary{display:flex;align-items:center;gap:8px;min-height:46px;font-weight:600;cursor:pointer}
.keyd summary .ic{color:var(--p600)}
.keyd ol{margin:4px 0 12px 22px;padding:0;display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.45}
@media (max-width:760px){.slotrow .num{width:30px;height:30px}.nb{width:44px;height:44px}}

/* ---------- S17: lima bagian respons ---------- */
.big17{max-width:100%;align-self:stretch;padding:16px 18px;font-size:clamp(17px,1rem + .35vw,19.5px);line-height:2;animation:none;border-radius:18px;border-top-right-radius:18px}
.seg5{padding:3px 7px;border-radius:9px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .25s,box-shadow .25s}
.seg5 sup{font-size:11px;font-weight:700;margin-right:4px;color:var(--p700)}
.seg5.s0{--c:#E3DAFB}.seg5.s1{--c:#FFE3B8}.seg5.s2{--c:#CDEBDA}.seg5.s3{--c:#CFE3F8}.seg5.s4{--c:#FAD3EA}
.seg5.seen{background:var(--c)}
.seg5.on{background:var(--c);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--p600)}

/* ---------- S18: susun respons ---------- */
.itemtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.itab{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:8px 20px;border-radius:999px;background:var(--p50);border:2px solid var(--line);font-weight:600;font-size:16px;color:var(--ink);transition:background .2s,border-color .2s}
.itab .ic{width:18px;height:18px;color:var(--ok)}
.itab.cur{background:var(--p600);border-color:var(--p600);color:#fff}.itab.cur .ic{color:#fff}
.itab:disabled{opacity:.5;cursor:not-allowed}
.custq{padding:10px 16px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--p500);border-radius:12px}
.custq p{margin:2px 0 0;font-size:17px;font-weight:600;line-height:1.4}
.words .word,.blank .word{border-radius:14px;line-height:1.35;text-align:left;padding:8px 14px}
.blank .word{padding:4px 6px}
.pvw{align-self:stretch;max-width:100%;padding:12px 14px;border-radius:16px;animation:none}
.pvw p{line-height:1.7}
.pv{border-radius:8px}.pv.empty{color:var(--ink2);opacity:.6}
.pvw p .pv:not(.empty){background:rgba(255,255,255,.7);padding:1px 5px}
@media (max-width:760px){.s-grid .paper{margin-top:4px}}
.msb .brand b{color:#fff;font-weight:700}

</style>
</head>

const pct = () => Math.round(PROG.reduce((a, k) => a + fill(k), 0) / PROG.length * 100);

/* ---------- efek suara (sintesis WebAudio, tanpa berkas) ---------- */
const SFX = (() => {
  let ctx = null, master = null, unlocked = false;
  function init() {
    if (ctx) return ctx;
    try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination); } catch (e) { ctx = null; }
    return ctx;
  }
  addEventListener('pointerdown', () => { unlocked = true; const c = init(); if (c && c.state === 'suspended') c.resume(); }, true);
  function tone(f, d, o = {}) {
    if (!unlocked) return; const c = init(); if (!c) return;
    const t0 = c.currentTime + (o.t || 0), os = c.createOscillator(), g = c.createGain();
    os.type = o.type || 'sine'; os.frequency.setValueAtTime(f, t0);
    if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t0 + d);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(o.g || .1, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    os.connect(g); g.connect(master); os.start(t0); os.stop(t0 + d + .03);
  }
  return {
    click() { tone(430, .05, { type: 'triangle', g: .06, f2: 300 }); },
    pop() { tone(520, .1, { g: .08, f2: 820 }); },
    tick() { tone(920, .04, { type: 'triangle', g: .03 }); },
    swish() { tone(240, .2, { g: .045, f2: 600 }); },
    ok() { tone(660, .14, { g: .08 }); tone(880, .24, { g: .08, t: .12 }); },
    no() { tone(230, .24, { type: 'triangle', g: .07, f2: 160 }); }
  };
})();
document.addEventListener('click', e => { const b = e.target.closest('button, [data-sfx]'); if (b && !b.disabled && !b.closest('[data-nosfx]')) SFX.click(); });

/* ---------- lapisan (laci, pop up) ---------- */
function openLayer(html, cls = '', onClose) {
  const wrap = document.createElement('div'); wrap.className = 'layer-item ' + cls; wrap.innerHTML = html;
  $('#layer').appendChild(wrap);
  const prev = document.activeElement, app = $('#app');
  app.inert = true;
  const foc = () => $$('button,[href],summary,[tabindex]:not([tabindex="-1"])', wrap).filter(e => !e.disabled && e.offsetParent !== null);
  function key(e) {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === 'Tab') { const f = foc(); if (!f.length) return; const a = f[0], b = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); b.focus(); } else if (!e.shiftKey && document.activeElement === b) { e.preventDefault(); a.focus(); } }
  }
  document.addEventListener('keydown', key, true);
  let closed = false;
  function close(restore = true) {
    if (closed) return; closed = true;
    document.removeEventListener('keydown', key, true); wrap.remove();
    if (!$('#layer').children.length) app.inert = false;
    if (restore && prev && prev.focus && document.contains(prev)) prev.focus();
    onClose && onClose();
  }
  wrap.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  wrap._close = close;
  setTimeout(() => { const a = $('[data-autofocus]', wrap) || foc()[0]; a && a.focus(); }, 40);
  return { el: wrap, close };
}
function closeAllLayers() { $$('#layer .layer-item').forEach(l => l._close && l._close(false)); $('#app').inert = false; }

function toast(html, ms = 4200) {
  const box = $('#toasts'); box.innerHTML = `<div class="toast" role="status">${html}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { const t = $('.toast', box); if (t) { t.classList.add('out'); setTimeout(() => { box.innerHTML = ''; }, 320); } }, ms);
}

function openDetail({ items, index = 0, keyPrefix, label, onClose, onDraw }) {

      </div></div></div>`, '', onClose);
  const draw = () => {

}

/* ---------- gelembung chat berurutan ---------- */
function bubble(m) {
  if (m.from === 'sys') return `<div class="sys">${m.text}</div>`;
  return `<div class="msg ${m.from}">${m.tag ? `<span class="tag">${ic(m.from === 'bot' ? 'sparkles' : 'users')} ${m.tag}</span>` : ''}<p>${m.text}</p>${m.time ? `<time>${m.time}</time>` : ''}</div>`;
}
function playChat(box, script, { onDone, sfx = true } = {}) {
  let timers = [], idx = 0, stopped = false, finished = false;
  const T = (fn, ms) => timers.push(setTimeout(fn, ms));
  const add = h => { box.insertAdjacentHTML('beforeend', h); box.scrollTop = box.scrollHeight; };
  const finish = () => { if (finished) return; finished = true; onDone && onDone(); };
  const clear = () => { stopped = true; timers.forEach(clearTimeout); timers = []; };
  function showAll() { clear(); box.innerHTML = script.map(bubble).join(''); $$('.msg,.sys', box).forEach(e => { e.style.animation = 'none'; }); box.scrollTop = box.scrollHeight; }
  function step() {
    if (stopped) return;
    if (idx >= script.length) { T(finish, 500); return; }
    const m = script[idx++];
    if (m.from === 'sys') { add(bubble(m)); T(step, 650); return; }
    add(`<div class="typing ${m.from === 'cust' ? 'l' : ''}" data-typing><i></i><i></i><i></i></div>`);
    T(() => { const t = $('[data-typing]', box); t && t.remove(); add(bubble(m)); sfx && SFX.pop(); T(step, m.gap || 950); }, m.typing || (m.from === 'cust' ? 750 : 1150));
  }
  return {
    start() { clear(); stopped = false; finished = false; idx = 0; box.innerHTML = ''; if (REDUCED) { showAll(); finish(); return; } T(step, 500); },
    skip() { showAll(); finish(); },
    showAll() { showAll(); finished = true; },
    stop: clear
  };
}

function seeded(n, seed) { const a = [...Array(n).keys()]; let s = seed; for (let i = n - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const cardNavHTML = (label = 'Lanjut', disabled = false) => `<div class="scene-nav"><div class="row">
  <button class="btn btn-secondary" id="bBack">${ic('arrow-left')} Kembali</button>
  <button class="btn btn-secondary mid" id="bMenu" aria-label="Menu Materi">${ic('layout-grid')}<span class="mid-lbl">Menu Materi</span></button>
  <button class="btn btn-primary" id="bNext" ${disabled ? 'disabled' : ''}>${label} ${ic('arrow-right')}</button></div></div>`;
function wireCardNav(root, { back, next, id, onNext }) {
  $('#bBack', root).onclick = () => go(back);
  $('#bMenu', root).onclick = () => go('s05');
  $('#bNext', root).onclick = () => { if (onNext) { onNext(); return; } if (id) { S.seen[id] = true; commit(); } go(next); };
}
function evalHead(score, total) {
  const p = Math.round(score / total * 100);
  const t = p === 100 ? { cls: 'ok', h: 'Sempurna', d: 'Anda sudah paham bagian ini.' }
    : p >= 70 ? { cls: '', h: 'Sudah baik', d: 'Periksa lagi bagian yang masih keliru, lalu lanjut.' }
    : { cls: 'warn', h: 'Perlu diulang', d: 'Baca kembali materinya, lalu coba lagi dengan Ulangi.' };
  return `<div class="evalhead ${t.cls}" role="status"><div class="ring big" style="--pct:${p}"><b>${p}</b></div>
    <div><h3>${t.h}</h3><p>${score} dari ${total} benar. ${t.d}</p><p class="small muted">Latihan ini tidak masuk skor kuis akhir.</p></div></div>`;
}
const headHTML = (eyebrowIcon, eyebrow, title, extra = '') => `<div class="scene-head"><div><span class="eyebrow">${ic(eyebrowIcon)} ${eyebrow}</span><h1 class="title">${title}</h1></div>${extra}</div>`;

/* ---------- komponen: soal pilihan ganda (cek per soal atau periksa semua) ---------- */
function mcq(root, { id, qs, mount, onChange }) {
  const A = ansOf(id), n = qs.length, L = 'abcdefgh';
  A.a = A.a || Array(n).fill(null); A.checked = A.checked || Array(n).fill(false);
  let qi = Math.max(0, A.a.findIndex(v => v == null)); const box = $(mount, root);
  const answered = () => A.a.filter(v => v != null).length;
  function drawQ() {
    const q = qs[qi], sel = A.a[qi], chk = A.checked[qi], ok = sel === q.key;
    box.innerHTML = `<div class="qhead"><div class="qchips" role="group" aria-label="Pilih soal">${qs.map((_, i) =>
      `<button class="qchip ${i === qi ? 'cur' : ''} ${A.a[i] != null ? 'ans' : ''} ${A.checked[i] ? (A.a[i] === qs[i].key ? 'ok' : 'bad') : ''}" data-qi="${i}" aria-label="Soal ${i + 1}${A.a[i] != null ? ', sudah dijawab' : ''}" ${i === qi ? 'aria-current="true"' : ''}>${i + 1}</button>`).join('')}</div>
      <span class="small muted">Soal ${qi + 1} dari ${n} · ${q.tik}</span></div>
    <p class="qtext" id="qt">${q.q}</p>
    <div class="opts" role="radiogroup" aria-labelledby="qt">${q.opts.map((o, i) => {
      let cls = '', st = '';
      if (chk) { if (i === q.key) { cls = i === sel ? 'ok' : 'key'; st = `<span class="st">${ic('circle-check')} ${i === sel ? 'Benar' : 'Jawaban benar'}</span>`; } else if (i === sel) { cls = 'bad'; st = `<span class="st">${ic('circle-x')} Belum tepat</span>`; } }
      else if (i === sel) cls = 'sel';
      return `<button class="opt ${cls}" role="radio" aria-checked="${i === sel}" data-o="${i}" ${chk ? 'disabled' : ''}><span class="let">${L[i]}</span><span>${o}</span>${st}</button>`;
    }).join('')}</div>
    ${chk ? `<div class="fb ${ok ? 'ok' : 'bad'}" role="status">${ic(ok ? 'circle-check' : 'info')}<span><b>${ok ? 'Benar.' : 'Belum tepat.'}</b> ${q.exp}</span></div>` : ''}
    <div class="qnav"><button class="btn btn-ghost" id="qPrev" ${qi === 0 ? 'disabled' : ''}>${ic('arrow-left')} Soal sebelumnya</button>
      <button class="btn btn-secondary" id="qCheck" ${sel == null || chk ? 'disabled' : ''}>${ic('circle-check')} Cek soal ini</button>
      <button class="btn btn-ghost" id="qNext" ${qi === n - 1 ? 'disabled' : ''}>Soal berikutnya ${ic('arrow-right')}</button></div>
    <div class="actions"><span class="hint">${ic('info')} ${answered()} dari ${n} soal dijawab${answered() < n ? '. Jawab semua soal untuk memeriksa.' : '. Siap diperiksa.'}</span>
      <div class="btns"><button class="btn btn-primary" id="qSubmit" ${answered() < n ? 'disabled' : ''}>Periksa semua jawaban</button></div></div>`;
  }
  function drawEval() {
    box.innerHTML = `${evalHead(A.score, n)}<div>${qs.map((q, i) => { const ok = A.a[i] === q.key;
      return `<div class="rev ${ok ? 'ok' : 'bad'}"><span class="rn" aria-hidden="true">${i + 1}</span><div><b>${q.q}</b>
        <span class="tag2">${ic(ok ? 'circle-check' : 'circle-x')} ${ok ? 'Benar' : 'Belum tepat'}</span>
        <p>${ok ? '' : `Jawaban Anda: ${q.opts[A.a[i]]}. `}Jawaban benar: ${q.opts[q.key]}. ${q.exp}</p></div></div>`; }).join('')}</div>
      <div class="actions"><span class="hint">${ic('info')} Jawaban Anda tersimpan di perangkat ini.</span><div class="btns"><button class="btn btn-secondary" id="qRetry">${ic('rotate-ccw')} Ulangi</button></div></div>`;
  }
  const draw = (focus) => { A.submitted ? drawEval() : drawQ(); onChange && onChange(A); if (focus) { const f = $(focus, box); f && f.focus(); } };
  box.addEventListener('click', e => {
    const o = e.target.closest('[data-o]'), c = e.target.closest('[data-qi]'), b = e.target.closest('button');
    if (o && !A.checked[qi]) { A.a[qi] = +o.dataset.o; save(); draw(`[data-o="${o.dataset.o}"]`); return; }
    if (c) { qi = +c.dataset.qi; draw(`[data-qi="${qi}"]`); return; }
    if (!b) return;
    if (b.id === 'qPrev' && qi > 0) { qi--; draw('#qNext'); }
    else if (b.id === 'qNext' && qi < n - 1) { qi++; draw('#qNext'); }
    else if (b.id === 'qCheck') { A.checked[qi] = true; save(); A.a[qi] === qs[qi].key ? SFX.ok() : SFX.no(); draw('#qNext'); }
    else if (b.id === 'qSubmit') {
      A.checked = A.checked.map(() => true); A.score = A.a.filter((v, i) => v === qs[i].key).length; A.submitted = true; commit();
      A.score / n >= .7 ? SFX.ok() : SFX.no(); draw(); box.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
    } else if (b.id === 'qRetry') { A.a = Array(n).fill(null); A.checked = Array(n).fill(false); A.submitted = false; delete A.score; qi = 0; commit(); draw(); }
  });
  draw();
  return A;
}

/* ---------- komponen: seret dan lepas (dengan alternatif ketuk) ---------- */
function bindDnD(host, { isLocked, onMove }) {
  let sel = null, drag = null, just = false;
  const tgtAt = (x, y) => { const el = document.elementFromPoint(x, y), t = el && el.closest('[data-target]'); return t && host.contains(t) ? t : null; };
  const mark = () => { $$('[data-item]', host).forEach(el => { const on = el.dataset.item === sel; el.classList.toggle('selected', on); el.setAttribute('aria-pressed', on); }); host.classList.toggle('has-sel', !!sel); };
  host.addEventListener('pointerdown', e => {
    if (isLocked() || e.button > 0) return; const it = e.target.closest('[data-item]'); if (!it) return;
    drag = { it, id: it.dataset.item, x: e.clientX, y: e.clientY, on: false, ghost: null };
  });
  const mv = e => {
    if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on && Math.hypot(dx, dy) > 7) {
      drag.on = true; const g = drag.it.cloneNode(true); g.classList.add('ghost'); g.classList.remove('selected'); g.style.width = drag.it.offsetWidth + 'px';
      document.body.appendChild(g); drag.ghost = g; drag.it.classList.add('dragging');
    }
    if (drag.on) {
      drag.ghost.style.transform = `translate(${e.clientX - drag.it.offsetWidth / 2}px,${e.clientY - 22}px)`;
      $$('.over', host).forEach(t => t.classList.remove('over')); const t = tgtAt(e.clientX, e.clientY); if (t) t.classList.add('over'); e.preventDefault();
    }
  };
  const end = (e, drop) => {
    if (!drag) return; const d = drag; drag = null; if (!d.on) return;
    d.ghost.remove(); d.it.classList.remove('dragging'); $$('.over', host).forEach(t => t.classList.remove('over'));
    just = true; setTimeout(() => { just = false; }, 60);
    const t = drop && tgtAt(e.clientX, e.clientY); if (t) { sel = null; onMove(d.id, t.dataset.target); mark(); }
  };
  const up = e => end(e, true), cancel = e => end(e, false);
  window.addEventListener('pointermove', mv, { passive: false }); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', cancel);
  onLeave(() => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', cancel); $$('.ghost').forEach(g => g.remove()); });
  host.addEventListener('click', e => {
    if (just || isLocked()) return;
    const it = e.target.closest('[data-item]'), tg = e.target.closest('[data-target]');
    if (sel) {
      if (it && it.dataset.item === sel) { sel = null; mark(); return; }
      if (tg && !(it && tg.dataset.target === 'bank')) { const id = sel; sel = null; onMove(id, tg.dataset.target); mark(); return; }
      if (it) { sel = it.dataset.item; mark(); }
    } else if (it) { sel = it.dataset.item; mark(); }
  });
  host.addEventListener('keydown', e => { const it = e.target.closest && e.target.closest('[data-item]'); if (it && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); it.click(); } });
  return { clear() { sel = null; mark(); } };
}

let ytReady = null;
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise((res, rej) => {
    if (window.YT && YT.Player) return res();
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev && prev(); res(); };
    if (!document.getElementById('yt-api')) {
      const s = document.createElement('script'); s.id = 'yt-api'; s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => rej(new Error('load')); document.head.appendChild(s);
    }
    setTimeout(() => rej(new Error('timeout')), 9000);
  }).catch(e => { ytReady = null; throw e; });
  return ytReady;
}

  init(root) {
    const A = ansOf('s14'); A.cp = A.cp || [];
    const nCp = CP14.length, answered = () => CP14.filter((_, i) => A.cp[i]).length, allDone = () => answered() === nCp;
    let player = null, ready = false, fb = false, timer = null, cc = false, playing = false, layer = null, pending = null, lastSave = 0, gone = false;
    const $v = s => $(s, root);
    const tools = $$('#vtools button.btn,#vtools .sp', root);

    function stat() {
      const n = answered();
      $v('#cpstat').innerHTML = `<span>${ic(n === nCp ? 'circle-check' : 'circle-help')} ${n} dari ${nCp} checkpoint dijawab${n < nCp ? '. Selesaikan semuanya untuk lanjut.' : '. Anda bisa lanjut.'}</span>${n ? `<button class="btn btn-ghost" id="cpReset">${ic('rotate-ccw')} Ulangi checkpoint</button>` : ''}`;

    function banner() {
      const b = $v('#cpBanner');

      else { b.hidden = true; b.innerHTML = ''; }
    }
    function chapters(t) {
      const max = A.maxT || 0; let cur = 0; CH14_T.forEach((s, i) => { if (t >= s) cur = i; });
      $$('.vc', root).forEach((b, i) => { const end = CH14_T[i + 1] != null ? CH14_T[i + 1] - 3 : (A.ended ? 0 : Infinity);
        const seen = max >= end || (i === CH14_T.length - 1 && A.ended);
        b.classList.toggle('cur', ready && i === cur); b.classList.toggle('done', !!seen); b.toggleAttribute('aria-current', ready && i === cur);
        $('.n', b).innerHTML = seen ? ic('check') : (i + 1); });
    }

    /* ---- checkpoint ---- */
    function openCP(i) {
      if (layer) return; pending = i;
      if (ready) { try { player.pauseVideo(); } catch (e) {} }
      try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {}
      const c = CP14[i]; let sel = null, checked = false;
      layer = openLayer(`<div class="modal-wrap clear"><div class="scrim"></div>
        <div class="modal cpm" role="dialog" aria-modal="true" aria-labelledby="cpT">
          <span class="eyebrow">${ic('circle-help')} Checkpoint ${i + 1} dari ${nCp}</span>
          <h2 id="cpT">${c.q}</h2>
          <div class="opts" role="radiogroup" aria-labelledby="cpT">${c.opts.map((o, k) => `<button class="opt" role="radio" aria-checked="false" data-o="${k}"><span class="let">${'abc'[k]}</span><span>${o}</span></button>`).join('')}</div>
          <div id="cpFb"></div>
          <div class="acts row"><button class="btn btn-primary" id="cpGo" disabled>Periksa jawaban</button></div>
        </div></div>`, '', () => { layer = null; if (A.cp[i]) { pending = null; banner(); resume(); } else banner(); });
      const L = layer.el;
      L.addEventListener('click', e => {
        const o = e.target.closest('[data-o]');
        if (o && !checked) { sel = +o.dataset.o; $$('.opt', L).forEach(b => { const on = b === o; b.classList.toggle('sel', on); b.setAttribute('aria-checked', on); }); $('#cpGo', L).disabled = false; return; }
        if (e.target.closest('#cpGo')) {
          if (!checked) {
            checked = true; const ok = sel === c.key; A.cp[i] = { a: sel, ok }; commit(); ok ? SFX.ok() : SFX.no();
            $$('.opt', L).forEach((b, k) => { b.disabled = true; b.classList.remove('sel'); if (k === c.key) { b.classList.add(k === sel ? 'ok' : 'key'); } else if (k === sel) b.classList.add('bad'); });
            $('#cpFb', L).innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}" role="status">${ic(ok ? 'circle-check' : 'info')}<span><b>${ok ? 'Benar.' : 'Belum tepat.'}</b> ${c.exp}</span></div>`;
            const go_ = $('#cpGo', L); stat(); go_.textContent = allDone() ? 'Selesai' : (fb ? 'Pertanyaan berikutnya' : 'Lanjutkan video'); go_.focus();
          } else layer.close(false);
        }
      });
    }
    function resume() {
      if (gone) return;
      if (ready && player) { try { if (player.getPlayerState() !== 0) player.playVideo(); } catch (e) {} }
      else if (fb) { const n = CP14.findIndex((_, j) => !A.cp[j]); if (n >= 0) setTimeout(() => openCP(n), 250); }
    }

    /* ---- pemutar ---- */
    function tick() {
      if (!ready || gone) return; let t = 0; try { t = player.getCurrentTime() || 0; } catch (e) { return; }
      $v('#vtime').textContent = `${fmtT(t)} / ${fmtT(player.getDuration() || VID.durasi)}`;
      if (t > (A.maxT || 0)) { A.maxT = t; if (Date.now() - lastSave > 4000) { save(); lastSave = Date.now(); } }
      chapters(t);
      if (!layer && pending == null) { const i = CP14.findIndex((c, k) => !A.cp[k] && t >= c.t); if (i >= 0) openCP(i); }
    }
    function fallback(why) {
      if (gone || fb) return; fb = true; ready = false; clearInterval(timer);
      try { player && player.destroy && player.destroy(); } catch (e) {} player = null;
      const isFile = why === 'file';
      $v('#vwrap').classList.add('fb');
      $v('#vwrap').innerHTML = `<div class="vfall">${ic(isFile ? 'video' : 'wifi-off', 'lg')}<h2>${isFile ? 'Video belum bisa diputar dari sini' : 'Video belum bisa dimuat'}</h2>
        <p>${isFile ? 'YouTube tidak mau memutar video saat MPI dibuka langsung dari folder.' : 'Pastikan perangkat terhubung internet.'} Anda bisa menonton lewat YouTube, lalu kembali ke sini untuk menjawab checkpoint.</p>
        <div class="row"><a class="btn btn-primary" href="${VID.url}" target="_blank" rel="noopener">${ic('external-link')} Buka di YouTube</a>
        <button class="btn btn-secondary" id="fbQ">${ic('circle-help')} ${answered() ? 'Lanjutkan checkpoint' : 'Mulai checkpoint'}</button></div>
        ${isFile ? `<details class="vdev"><summary>Untuk pengembang: supaya video tampil di dalam MPI</summary><ol>
          <li>Letakkan file video bernama <b>tutorial.mp4</b> di folder <b>video</b>, sejajar dengan file MPI ini. Video akan diputar langsung tanpa internet.</li>
          <li>Atau unggah MPI ke hosting web (misalnya Netlify atau GitHub Pages). Dari alamat web, video YouTube bisa tampil di sini.</li></ol></details>` : ''}</div>`;
      $v('#vtools').hidden = true; $$('.vc', root).forEach(b => { b.disabled = true; $('small', b).textContent = ''; });
    }
    function becameReady() {
      ready = true; const l = $v('#vload'); l && l.remove();
      tools.concat($$('.vc', root)).forEach(b => { b.disabled = false; }); if (DEV) { const d = $v('#tDev'); d && (d.disabled = false); }
      timer = setInterval(tick, 300); chapters(0);
    }
    function stateChanged(code) {
      playing = code === 1; const b = $v('#tPlay'); if (b) b.innerHTML = playing ? `${ic('pause')} <span>Jeda</span>` : `${ic('play')} <span>Putar</span>`;
      if (code === 0) { const d = (player && player.getDuration()) || VID.durasi; A.ended = true; A.maxT = Math.max(A.maxT || 0, d); commit(); chapters(d); const i = CP14.findIndex((_, k) => !A.cp[k]); if (i >= 0 && !layer) openCP(i); }
    }
    /* jalur 1: video lokal di folder video/ (berdiri sendiri) */
    function mountLocal() {
      return new Promise((res, rej) => {
        const w = $v('#vwrap'), v = document.createElement('video'); let to;
        v.controls = true; v.playsInline = true; v.preload = 'metadata'; v.setAttribute('controlslist', 'nodownload'); v.setAttribute('aria-label', 'Video tutorial setup chatbot');
        v.innerHTML = `<source src="${VID.local.mp4}" type="video/mp4"><source src="${VID.local.webm}" type="video/webm">`;
        if (SUBS14.length) { const tr = v.addTextTrack('captions', 'Indonesia', 'id'); tr.mode = 'hidden'; SUBS14.forEach(([s, e, x]) => tr.addCue(new VTTCue(s, e, x))); }
        const end = ok => { clearTimeout(to); ok ? res(v) : (v.remove(), rej(new Error('nolocal'))); };
        to = setTimeout(() => end(false), 8000);
        v.addEventListener('loadedmetadata', () => end(true), { once: true });
        v.querySelectorAll('source')[1].addEventListener('error', () => end(false));
        w.insertBefore(v, w.firstChild);
      });
    }
    function adapt(v) {
      return { getCurrentTime: () => v.currentTime || 0, getDuration: () => v.duration || 0, seekTo: s => { v.currentTime = s; },
        playVideo: () => { const p = v.play(); p && p.catch && p.catch(() => {}); }, pauseVideo: () => v.pause(),
        getPlayerState: () => v.ended ? 0 : (v.paused ? 2 : 1), setPlaybackRate: r => { v.playbackRate = r; },
        loadModule: () => { const tr = v.textTracks[0]; if (!tr || !tr.cues || !tr.cues.length) { toast('Teks belum tersedia untuk video ini.'); throw new Error('no'); } tr.mode = 'showing'; },
        unloadModule: () => { const tr = v.textTracks[0]; tr && (tr.mode = 'hidden'); },
        destroy: () => { try { v.pause(); v.remove(); } catch (e) {} } };
    }
    /* jalur 2: YouTube (hanya jalan bila MPI dibuka dari alamat web, bukan dari file) */
    function bindYT() {
      loadYT().then(() => {
        if (gone) return;
        player = new YT.Player('ytp', { videoId: VID.id, width: '100%', height: '100%',
          playerVars: { rel: 0, modestbranding: 1, playsinline: 1, hl: 'id', cc_lang_pref: 'id' },
          events: { onReady: becameReady, onStateChange: e => stateChanged(e.data), onError: () => fallback('error') } });
      }).catch(() => fallback('load'));
      setTimeout(() => { if (!ready && !fb) fallback('timeout'); }, 12000);
    }
    function bindPlayer() {
      mountLocal().then(v => {
        if (gone) { v.remove(); return; }
        const y = $v('#ytp'); y && y.remove(); player = adapt(v);
        v.addEventListener('play', () => stateChanged(1)); v.addEventListener('pause', () => { if (!v.ended) stateChanged(2); }); v.addEventListener('ended', () => stateChanged(0));
        becameReady();
      }, () => {
        if (gone) return;
        if (!/^https?:$/.test(location.protocol)) return fallback('file');
        if (navigator.onLine === false) return fallback('offline');
        bindYT();
      });
    }

    /* ---- kontrol ---- */
    root.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.id === 'tPlay' && ready) { playing ? player.pauseVideo() : player.playVideo(); }
      else if (t.id === 'tBack' && ready) player.seekTo(Math.max(0, player.getCurrentTime() - 10), true);
      else if (t.id === 'tFwd' && ready) player.seekTo(player.getCurrentTime() + 10, true);
      else if (t.classList.contains('sp') && ready) { const r = +t.dataset.r; try { player.setPlaybackRate(r); } catch (er) {} $$('.sp', root).forEach(b => b.setAttribute('aria-pressed', b === t)); }
      else if (t.id === 'tCC' && ready) { try { cc ? player.unloadModule('captions') : player.loadModule('captions'); cc = !cc; t.setAttribute('aria-pressed', cc); } catch (er) { if (!er || er.message !== 'no') toast('Nyalakan teks lewat tombol CC di pemutar.'); } }
      else if (t.id === 'tDev' && ready) { const s = Math.floor(player.getCurrentTime()); toast(`Waktu sekarang: ${s} detik (${fmtT(s)})`); console.log('waktu', s); }
      else if (t.classList.contains('vc') && ready) { player.seekTo(CH14_T[+t.dataset.i], true); player.playVideo(); $v('#vwrap').scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); }
      else if (t.id === 'cpOpen') openCP(pending);
      else if (t.id === 'fbQ') { const n = CP14.findIndex((_, j) => !A.cp[j]); openCP(n >= 0 ? n : 0); }
      else if (t.id === 'cpReset') { A.cp = []; pending = null; A.ended = false; commit(); stat(); banner(); if (ready) { try { player.seekTo(0, true); player.pauseVideo(); } catch (er) {} } }
    });
    const note = $v('#note'); note.value = A.note || ''; if (A.note) $v('.vnote').open = true;
    note.addEventListener('input', () => { A.note = note.value; save(); });

    onLeave(() => { gone = true; clearInterval(timer); if (layer) { const l = layer; layer = null; l.close(false); } try { player && player.destroy && player.destroy(); } catch (e) {} A.maxT && save(); });
    stat(); chapters(A.maxT ? 0 : 0); wireCardNav(root, { back: 's13', next: 's15', id: 's14' });
    bindPlayer();
  }
};
